[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptocustode"
version = "0.1.0"
requires-python = ">=3.14"

[tool.setuptools.packages.find]
include = ["cryptocustode*"]

# `cryptocustode/ui/` non è un package Python — non ha `__init__.py`, e non deve
# averlo — quindi `packages.find` non lo vede e senza questa voce una
# `pip install .` produrrebbe un'installazione in cui `crea_app()` muore sul
# mount degli statici. Oggi l'app si lancia dal clone, quindi il difetto è
# latente: ma il repo dichiara un `build-system`, e una trappola latente in un
# artefatto di consegna è comunque una trappola.
[tool.setuptools.package-data]
cryptocustode = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider -m 'not rete'"
markers = [
    "rete: test che richiedono connettività o una API key",
]
# `-m 'not rete'` sopra è ciò che tiene questi test fuori dalla suite di
# default (spec §4 invariante 5, spec §13): senza, `python -m pytest -q`
# farebbe chiamate vere a Gemini a ogni esecuzione, su qualunque macchina dove
# la chiave è impostata — e `verifica_configurazione_ia` la rende obbligatoria
# per far partire l'applicazione. Costano denaro e mandano testo di documenti
# a un servizio terzo: due ragioni sufficienti a tenerli fuori per scelta e
# non per l'assenza accidentale della chiave su questa macchina. Lo `skipif`
# dentro `tests/test_documenti_di_verifica.py` resta al suo posto come seconda
# cintura, non come unica: da solo dipendeva da una proprietà della macchina,
# non del codice. Per eseguirli di proposito: `pytest -m rete`.
# Due deprecazioni a monte, emesse all'import di `fastapi.testclient` e non da
# codice nostro: starlette 1.6 preferisce `httpx2` a `httpx` (che la spec §3
# pinna, e che il TestClient usa comunque senza problemi), e usa un alias di
# anyio già deprecato. Nessuna delle due è azionabile qui, ed entrambe
# comparirebbero a ogni esecuzione della suite: l'output pulito dei test è un
# criterio di revisione, quindi il rumore andrebbe segnalato a ogni task.
#
# Ogni filtro è ristretto a messaggio, categoria e modulo che lo emette, così
# non copre nient'altro: qualunque altro warning, e in particolare qualunque
# warning di codice nostro, resta visibile. Nota che la categoria del primo è
# `StarletteDeprecationWarning`, che estende `UserWarning` e **non**
# `DeprecationWarning`: pinnarlo come deprecazione lo lascerebbe passare.
#
# Quando rivedere questa voce: al prossimo aggiornamento di starlette o alla
# migrazione a `httpx2`. Il primo messaggio è il segnale con cui il monte
# chiede quella migrazione, e da qui in poi tace: se un giorno `httpx` non
# fosse più supportato, non lo si scoprirebbe da un warning ma da un errore.
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning:fastapi.testclient",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
